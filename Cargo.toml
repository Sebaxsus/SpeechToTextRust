[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.9"}
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
qdrant-client = "1.18"
ollama-rs = "0.3.4"
uuid = { version = "1.23.1", features = ["v4", "v5"] }
whisper-rs = "0.16.0"
symphonia = { version = "0.6.0", features = ["all"] }
rubato = "0.15"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = "0.5.0"
# `esaxx_fast` (default feature) compila una dependencia C++ (`esaxx-rs`) con runtime estático
# (/MT), que en Windows/MSVC choca en link time (LNK2038) con el build CMake de
# `whisper-rs-sys` (runtime dinámico, /MD). Ese feature solo acelera el *entrenamiento* de un
# tokenizer Unigram/SentencePiece — acá solo cargamos un `tokenizer.json` ya entrenado, así que
# desactivarlo no afecta la carga ni la tokenización en runtime.
tokenizers = { version = "0.22.0", default-features = false, features = [
  "onig",
  "progressbar",
] }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tracing-appender = "0.2.3"
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
dotenvy = "0.15"
# `CorsLayer` para que el cliente web (Astro, otro origen/puerto) pueda llamar la API directo
# desde `fetch()` del browser — ver router::crear_router y CLIENT_ORIGIN en config.rs. Ya estaba
# resuelta transitivamente (vía axum/rmcp) en Cargo.lock; se fija como dependencia directa con
# esa misma versión, solo el feature `cors`.
tower-http = { version = "0.6.11", features = ["cors"] }
# Cliente HTTP mínimo para el webhook saliente (POST best-effort a callback_url cuando un job
# termina/falla, ver handlers::audio_handler::notificar_callback_url) — la única llamada HTTP
# saliente propia del proyecto que no sea a Ollama/Qdrant (que usan sus propios clientes). Solo
# el feature `json` (serializar {job_id, status}); TLS default para poder aceptar callback_url
# https, no solo http local.
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"

[lints.clippy]
all = "warn"
