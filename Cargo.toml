[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.9"}
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
qdrant-client = "1.18"
ollama-rs = "0.3.4"
uuid = { version = "1.23.1", features = ["v4", "v5"] }
whisper-rs = "0.16.0"
symphonia = { version = "0.6.0", features = ["all"] }
rubato = "0.15"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"

[lints.clippy]
all = "warn"